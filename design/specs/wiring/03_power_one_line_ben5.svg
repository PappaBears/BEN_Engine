r','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#6EE7A8" text-anchor="start">No separately derived system: neutral bonded at the service only</text><text x="994" y="568" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#6EE7A8" text-anchor="start">Lightning: Class II air terminals on 20 / 40 ft containers in high-keraunic sites (option)</text><rect x="980" y="625" width="560" height="184" rx="8" fill="#152234" stroke="#9FB3CC" stroke-width="1.5"/><text x="994" y="649" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#9FB3CC" text-anchor="start">Sizes come from ben_engine.config — change the config, not this drawing</text><text x="994" y="673" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#EDF4FF" text-anchor="start">Service 50 A @ 208/240 V 1ph: calc 41 A incl. 125 % continuous</text><text x="994" y="690" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#EDF4FF" text-anchor="start">Total 7.5 kW = IT 5.0 + cooling 1.92 + aux</text><text x="994" y="707" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#EDF4FF" text-anchor="start">UPS carries IT only: 2 × 6 kVA, 15 % headroom, N+1</text><text x="994" y="724" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#EDF4FF" text-anchor="start">Battery 0.9 kWh Li-ion for 10 min at full IT (90 % DoD)</text><text x="994" y="741" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#EDF4FF" text-anchor="start">Rack branch 30 A @ 240 V 1φ for 5.0 kW/rack</text><text x="994" y="758" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#EDF4FF" text-anchor="start">Selective coordination main &gt; ATS &gt; UPS &gt; panel &gt; branch — EOR verifies TCC</text><text x="99