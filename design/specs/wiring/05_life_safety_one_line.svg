 UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">Class B IDC, 4.7 kΩ EOL</text><path d="M440,425 L520,425 L520,400 L600,400" fill="none" stroke="#FF707D" stroke-width="2.5" stroke-linejoin="round"/><rect x="363.07000000000005" y="102" width="313.85999999999996" height="19" rx="4" fill="#0B1018" opacity="0.92"/><text x="520" y="115" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#FF707D" text-anchor="middle">supervised initiating circuits, FPLR cable, red</text><rect x="80" y="500" width="360" height="70" rx="10" fill="#1B2B42" stroke="#FF707D" stroke-width="2.5"/><text x="260.0" y="526" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#EDF4FF" text-anchor="middle">EPO STATION — door 1</text><text x="260.0" y="548" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">mushroom head, protective cover, labelled</text><text x="260.0" y="564" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">NC contacts in series loop</text><rect x="80" y="590" width="360" height="70" rx="10" fill="#1B2B42" stroke="#FF707D" stroke-width="2.5"/><text x="260.0" y="616" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#EDF4FF" text-anchor="middle">EPO STATION — door 2</text><text x="260.0" y="638" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">mushroom head, protective cover, labelled</text><text x="260.0" y="654" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">NC contacts in series loop</text><path d="M440,535 L480,535 L480,625 L440,625" fill="none" stroke="#FF707D" stroke-width="2.5" stroke-linejoin="round"/><path d="M480,580 L560,580 L560,480 L600,480" fill="none" stroke="#FF707D" stroke-width="2.5" stroke-linejoin="round"/><rect x="463.6" y="557.0" width="164.79999999999998" height="21" rx="4" fill="#0B1018" opacity="0.92"/><text x="546.0" y="572.0" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="600" fill="#FF707D" text-anchor="middle">EPO loop (series NC)</text><rect x="80" y="690" width="360" height="70" rx="10" fill="#1B2B42" stroke="#FF707D" stroke-width="2.5"/><text x="260.0" y="716" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#EDF4FF" text-anchor="middle">ABORT STATION + MANUAL RELEASE</text><text x="260.0" y="738" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">abort: hold to pause 30 s countdown</text><text x="260.0" y="754" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">manual release: dual action, at exit</text><path d="M440,725 L540,725 L540,500 L600,500" fill="none" stroke="#FF707D" stroke-width="2.5" stroke-linejoin="round"/><rect x="1080" y="120" width="460" height="80" rx="10" fill="#1B2B42" stroke="#FF707D" stroke-width="2.5"/><text x="1310.0" y="146" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#EDF4FF" text-anchor="middle">CLEAN AGENT CYLINDER(S) — FK-5-1-12 / IG-541</text><text x="1310.0" y="168" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">supervised actuator · nozzles sized for room volume at 5–8 % design concentration</text><path d="M1000,360 L1040,360 L1040,160 L1080,160" fill="none" stroke="#FF707D" stroke-width="2.5" stroke-linejoin="round"/><rect x="1080" y="220" width="460" height="80" rx="10" fill="#1B2B42" stroke="#FF707D" stroke-width="2.5"/><text x="1310.0" y="246" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#EDF4FF" text-anchor="middle">HORN/STROBES + 'DO NOT ENTER' sign</text><text x="1310.0" y="268" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">pre-discharge horn, discharge strobe, outside sign</text><path d="M1000,380 L1040,380 L1040,260 L1080,260" fill="none" stroke="#FF707D" stroke-width="2.5" stroke-linejoin="round"/><rect x="1080" y="320" width="460" height="80" rx="10" fill="#1B2B42" stroke="#FF707D" stroke-width="2.5"/><text x="1310.0" y="346" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#EDF4FF" text-anchor="middle">DAMPERS CLOSE · ECONOMIZER CLOSE · IN-ROW FANS OFF</text><text x="1310.0" y="368" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">relay to mechanical panel — hardwired, fail-closed dampers</text><path d="M1000,400 L1040,400 L1040,360 L1080,360" fill="none" stroke="#FF707D" stroke-width="2.5" stroke-linejoin="round"/><rect x="1080" y="420" width="460" height="80" rx="10" fill="#1B2B42" stroke="#FF707D" stroke-width="2.5"/><text x="1310.0" y="446" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#EDF4FF" text-anchor="middle">SHUNT TRIPS — UPS output · IT panel · mech. panel</text><text x="1310.0" y="468" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">EPO shunt trips; UPS stops output; batteries disconnect (NFPA 75 disconnecting means; Art. 645 not invoked)</text><path d="M1000,420 L1040,420 L1040,460 L1080,460" fill="none" stroke="#FF707D" stroke-width="2.5" stroke-linejoin="round"/><rect x="1080" y="520" width="460" height="80" rx="10" fill="#1B2B42" stroke="#FF707D" stroke-width="2.5"/><text x="1310.0" y="546" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#EDF4FF" text-anchor="middle">DOOR INTERLOCKS</text><text x="1310.0" y="568" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">doors unlock on alarm for egress (fail-safe), auto-closers hold the agent</text><path d="M1000,440 L1040,440 L1040,560 L1080,560" fill="none" stroke="#FF707D" stroke-width="2.5" stroke-linejoin="round"/><rect x="892.64" y="87" width="294.71999999999997" height="19" rx="4" fill="#0B1018" opacity="0.92"/><text x="1040" y="100" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#FF707D" text-anchor="middle">supervised releasing / notification circuits</text><rect x="60" y="800" width="1480" height="3" fill="#66E3FF"/><text x="70" y="790" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#66E3FF" text-anchor="start">BELOW THE LINE: CONTROLS (reads only)</text><rect x="600" y="820" width="400" height="70" rx="10" fill="#1B2B42" stroke="#66E3FF" stroke-width="2.5"/><text x="800.0" y="846" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#EDF4FF" text-anchor="middle">BEN NODE  X6 'EPO C / EPO NO'  + spare DI</text><text x="800.0" y="868" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">reads panel AUX dry contacts: ALARM · TROUBLE · RELEASED · EPO</text><text x="800.0" y="884" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">MONITOR ONLY — cannot open, close or inhibit anything above the line</text><path d="M800,530 L800,820" fill="none" stroke="#66E3FF" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="10 7"/><rect x="612.04" y="652.0" width="375.91999999999996" height="21" rx="4" fill="#0B1018" opacity="0.92"/><text x="800.0" y="667.0" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="600" fill="#66E3FF" text-anchor="middle">AUX dry contacts (Form C), unsupervised, to node</text><rect x="1080" y="820" width="460" height="70" rx="10" fill="#1B2B42" stroke="#66E3FF" stroke-width="2.5"/><text x="1310.0" y="846" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#EDF4FF" text-anchor="middle">GATEWAY → DASHBOARD / ALARM</text><text x="1310.0" y="868" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">ben/&lt;unit&gt;/alarm sev=critical · SMS/e-mail via customer's system</text><text x="1310.0" y="884" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">no command path back to the panel exists (by design)</text><path d="M1000,855 L1080,855" fill="none" stroke="#66E3FF" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="10 7"/><rect x="80" y="820" width="500" height="144" rx="8" fill="#152234" stroke="#FF707D" stroke-width="1.5"/><text x="94" y="844" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#FF707D" text-anchor="start">Rules</text><text x="94" y="868" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#FF707D" text-anchor="start">1. Life-safety circuits: FPLR/FPLP red cable, own conduit, no shared boxes.</text><text x="94" y="885" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#FF707D" text-anchor="start">2. Releasing panel on its own locked-on breaker, not on the controls UPS.</text><text x="94" y="902" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#FF707D" text-anchor="start">3. The node sees the panel through dry contacts only (dashed line).</text><text x="94" y="919" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#FF707D" text-anchor="start">4. Test per NFPA 72 ch. 14 yearly; log in docs/MAINTENANCE.md records.</text><text x="94" y="936" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#FF707D" text-anchor="start">5. Nothing on MQTT / Modbus / SNMP can release agent or trip EPO.</text><rect x="1160" y="690" width="330" height="86" rx="8" fill="#152234" stroke="#9FB3CC" stroke-width="1"/><text x="1174" y="712" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#EDF4FF" text-anchor="start">Legend</text><line x1="1174" y1="736" x2="1224" y2="736" stroke="#FF707D" stroke-width="3.5"/><text x="1236" y="741" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#9FB3CC" text-anchor="start">Life-safety circuits — hardwired, supervised</text><line x1="1174" y1="762" x2="1224" y2="762" stroke="#66E3FF" stroke-width="3.5" stroke-dasharray="8 6"/><text x="1236" y="767" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#9FB3CC" text-anchor="start">Dry-contact status to controls (read only)</text><text x="32" y="1022" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" fill="#9FB3CC">Schreiber AI · BEN Engine · IFR Rev B · 2026-11-08 · ISSUED FOR REVIEW — not for construction until checked · generated by design/specs/wiring/gen_wiring.py from software/ben_engine/config.py and design/REVISION.json · Not for construction until stamped by the EOR</text></svg>