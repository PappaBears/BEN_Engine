00" fill="#6EE7A8" text-anchor="start">OUTSIDE — condenser pad / roof frame</text><rect x="1300" y="140" width="240" height="130" rx="10" fill="#1B2B42" stroke="#66E3FF" stroke-width="2.5" stroke-dasharray="8 6"/><text x="1420.0" y="166" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#EDF4FF" text-anchor="middle">ECONOMIZER (option)</text><text x="1420.0" y="188" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">outdoor air damper + filter bank</text><text x="1420.0" y="204" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">+ mixing section, dP_filter via ai0</text><text x="1420.0" y="220" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">enabled below 18 °C dry bulb</text><rect x="1050" y="560" width="490" height="120" rx="10" fill="#1B2B42" stroke="#66E3FF" stroke-width="2.5"/><text x="1295.0" y="586" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#EDF4FF" text-anchor="middle">MECHANICAL PANEL</text><text x="1295.0" y="608" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">4 units × own breaker + local disconnect at each unit</text><text x="1295.0" y="624" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">condensers on own circuits · fed after ATS, before UPS</text><text x="1295.0" y="640" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">unit controllers run standalone · Modbus to gateway · relay1 = enable (failsafe)</text><path d="M1050,620 L980,620 L980,460 L900,460" fill="none" stroke="#66E3FF" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="10 7"/><rect x="867.44" y="574.0" width="225.11999999999998" height="21" rx="4" fill="#0B1018" opacity="0.92"/><text x="980.0" y="589.0" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" font-weight="600" fill="#66E3FF" text-anchor="middle">Modbus RTU/TCP + 24 V enable</text><rect x="80" y="680" width="440" height="80" rx="10" fill="#1B2B42" stroke="#FF707D" stroke-width="2.5"/><text x="300.0" y="706" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#EDF4FF" text-anchor="middle">CONDENSATE + LEAK</text><text x="300.0" y="728" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">each in-row: condensate pump → drain to outside, trap, heat-traced in cold climates</text><text x="300.0" y="744" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">leak rope under every unit and along the drain → node 'leak' (critical alarm)</text><rect x="560" y="680" width="420" height="80" rx="10" fill="#1B2B42" stroke="#66E3FF" stroke-width="2.5"/><text x="770.0" y="706" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#EDF4FF" text-anchor="middle">CONTROLS SEQUENCE (gateway)</text><text x="770.0" y="728" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">units on own setpoints; gateway trims supply setpoint ±2 K by T_in max</text><text x="770.0" y="744" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" fill="#9FB3CC" text-anchor="middle">N+1: rotate lead unit weekly · fault → remaining units ramp</text><rect x="1050" y="700" width="490" height="104" rx="8" fill="#152234" stroke="#9FB3CC" stroke-width="1.5"/><text x="1064" y="724" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#9FB3CC" text-anchor="start">Setpoints and limits</text><text x="1064" y="748" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#EDF4FF" text-anchor="start">supply air 20 °C ± 2 · return ≤ 42 °C · aisle dP 5–15 Pa positive</text><text x="1064" y="765" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#EDF4FF" text-anchor="start">derate 1.5 %/K above 35 °C outdoor (config) → 35.0 kW/unit at design</text><text x="1064" y="782" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#EDF4FF" text-anchor="start">filters MERV 8 pre / MERV 13 at economizer · change at dP_filter 150 Pa</text><rect x="80" y="800" width="330" height="138" rx="8" fill="#152234" stroke="#9FB3CC" stroke-width="1"/><text x="94" y="822" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#EDF4FF" text-anchor="start">Legend</text><line x1="94" y1="846" x2="144" y2="846" stroke="#66E3FF" stroke-width="3.5"/><text x="156" y="851" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#9FB3CC" text-anchor="start">Air path / controls</text><line x1="94" y1="872" x2="144" y2="872" stroke="#6EE7A8" stroke-width="3.5" stroke-dasharray="8 6"/><text x="156" y="877" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#9FB3CC" text-anchor="start">Refrigerant lines</text><line x1="94" y1="898" x2="144" y2="898" stroke="#FFC66D" stroke-width="3.5"/><text x="156" y="903" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#9FB3CC" text-anchor="start">IT racks (heat source)</text><line x1="94" y1="924" x2="144" y2="924" stroke="#FF707D" stroke-width="3.5"/><text x="156" y="929" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" fill="#9FB3CC" text-anchor="start">Condensate / leak</text><text x="32" y