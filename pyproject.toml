[project]
name = "ben-engine"
version = "0.1.0"
description = "Schreiber AI BEN Engine — modular data center controls, digital twin, CFD, calibration and commissioning"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0","scipy>=1.14","matplotlib>=3.9","pandas>=2.2","pillow>=10","fastapi>=0.115","uvicorn>=0.30","httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["software"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["software"]
