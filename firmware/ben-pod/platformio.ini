; BEN Engine — BEN Pod v1 firmware (Schreiber AI) — Silicon Labs MGM240P (EFR32MG24) + OpenThread
; Two environments share the same application code through lib/benhal:
;   mgm240p : real hardware. NOTE: PlatformIO has only community-level support for the Gecko (EFR32)
;             family and none for the Silicon Labs OpenThread stack; this env is a cross-compile of the
;             application sources against an SDK checkout you point at (BEN_SISDK). The supported build
;             is the Simplicity Studio project in gecko/ben_pod.slcp or the CMake flow in gecko/CMakeLists.txt.
;   native  : host build + Unity unit tests (mock HAL). This is the acceptance for lib/bencore.

[platformio]
default_envs = native
description  = BEN Pod v1 sensor node firmware (Thread/IPv6, Secure Vault) — implements spec/PROTOCOL.md

[env]
test_framework = unity
build_flags =
    -DBEN_FW_VERSION=\"1.0.0\"
    -DBEN_RING_SECONDS=3600

; ------------------------------------------------------------------ MGM240P (EFR32MG24B310F1536IM48)
; Requires: arm-none-eabi-gcc 12.x, Simplicity SDK (BEN_SISDK env var -> SDK root), Silicon Labs
; Gecko Bootloader image on the module, and the generated autogen/ folder from `slc generate` on
; gecko/ben_pod.slcp (PlatformIO cannot run the Silicon Labs component generator itself).
[env:mgm240p]
platform  = https://github.com/platformio/platform-siliconlabsefm32.git
board     = mgm240p
framework =
board_build.mcu = efr32mg24b310f1536im48
board_build.f_cpu = 78000000L
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DBEN_TARGET_EFR32
    -DEFR32MG24B310F1536IM48
    -DSL_COMPONENT_CATALOG_PRESENT
    -DOPENTHREAD_FTD=1
    -DMBEDTLS_PSA_CRYPTO_C
    -DMBEDTLS_USE_PSA_CRYPTO
    -I${sysenv.BEN_SISDK}/platform/common/inc
    -I${sysenv.BEN_SISDK}/platform/Device/SiliconLabs/EFR32MG24/Include
    -I${sysenv.BEN_SISDK}/platform/emlib/inc
    -I${sysenv.BEN_SISDK}/platform/emdrv/nvm3/inc
    -I${sysenv.BEN_SISDK}/platform/emdrv/spidrv/inc
    -I${sysenv.BEN_SISDK}/platform/driver/i2cspm/inc
    -I${sysenv.BEN_SISDK}/platform/service/sleeptimer/inc
    -I${sysenv.BEN_SISDK}/platform/service/system/inc
    -I${sysenv.BEN_SISDK}/platform/service/memory_manager/inc
    -I${sysenv.BEN_SISDK}/platform/bootloader/api
    -I${sysenv.BEN_SISDK}/util/third_party/openthread/include
    -I${sysenv.BEN_SISDK}/util/third_party/openthread/src/core
    -I${sysenv.BEN_SISDK}/util/third_party/mbedtls/include
    -I${sysenv.BEN_SISDK}/platform/security/sl_component/sl_mbedtls_support/inc
    -I${sysenv.BEN_SISDK}/platform/security/sl_component/sl_psa_driver/inc
    -I${sysenv.BEN_SISDK}/protocol/openthread/include
    -Igecko/autogen
    -Igecko/config
upload_protocol = jlink
debug_tool = jlink
; Battery Pod W: add -DBEN_POD_W_BATTERY -DOPENTHREAD_MTD=1 (and drop OPENTHREAD_FTD) for the sleepy build.
test_ignore = test_core

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -std=c++17
    -DBEN_NATIVE
    -Wall -Wextra
test_build_src = no
