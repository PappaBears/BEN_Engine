; BEN Engine — BEN Node v1 firmware (Schreiber AI)
; Two environments share the same application code through lib/benhal:
;   olimex_esp32_poe_iso  : real hardware (Olimex ESP32-POE-ISO, Arduino framework)
;   native                : host build + Unity unit tests (mock HAL)

[platformio]
default_envs = olimex_esp32_poe_iso
description  = BEN Node v1 sensor/IO node firmware — implements spec/PROTOCOL.md

[env]
test_framework = unity
build_flags =
    -DBEN_FW_VERSION=\"1.0.0\"
    -DBEN_RING_SECONDS=3600

[env:olimex_esp32_poe_iso]
platform  = espressif32
board     = olimex_esp32-poe-iso
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DBEN_TARGET_ESP32
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit SHT4x Library @ ^1.0.4
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    sensirion/Sensirion I2C SDP @ ^0.1.0
; Unit tests run on the host; the ESP32 env only builds the application.
test_ignore = test_core

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -std=c++17
    -DBEN_NATIVE
    -Wall -Wextra
test_build_src = no
