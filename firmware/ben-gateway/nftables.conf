#!/usr/sbin/nft -f
# BEN Engine gateway firewall — Schreiber AI. Installed to /etc/ben/nftables.conf
# Zones (CONTROLS_SPEC.md): eth0 = controls VLAN 20 (nodes), eth0.30 = management VLAN 30,
# eth0.40 = customer IT (isolated, no routing), wan0 = optional WAN uplink (OFF by default),
# wg0 = optional outbound-only VPN for Schreiber AI remote support.
# Default: DROP everything, no forwarding, no WAN. The gateway never routes between VLANs.
flush ruleset

define CTRL   = "eth0"        # 10.20.0.0/24 — nodes, meters (Modbus TCP gw), PDUs (SNMP), cooling, UPS
define MGMT   = "eth0.30"     # 10.30.0.0/24 — dashboard, engineering laptop
define WAN    = "wan0"        # disabled unless ENABLE_WAN=1 at install
define VPN    = "wg0"

table inet ben {
    set ctrl_nodes { type ipv4_addr; flags interval; elements = { 10.20.0.0/24 } }
    set mgmt_hosts { type ipv4_addr; flags interval; elements = { 10.30.0.0/24 } }

    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert } accept

        # Controls VLAN: nodes -> broker (1883) and SNTP (123); nothing else inbound from nodes
        iifname $CTRL ip saddr @ctrl_nodes tcp dport 1883 accept
        iifname $CTRL ip saddr @ctrl_nodes udp dport 123 accept
        iifname $CTRL ip saddr @ctrl_nodes udp dport 67 accept      # DHCP for nodes (dnsmasq on the gateway)

        # Management VLAN: dashboard/API (8000), MQTT TLS (8883), MQTT-WS (9001), SSH (22), SNTP
        iifname $MGMT ip saddr @mgmt_hosts tcp dport { 22, 8000, 8883, 9001 } accept
        iifname $MGMT ip saddr @mgmt_hosts udp dport 123 accept

        # Remote support over VPN only (SSH + API), never over raw WAN
        iifname $VPN tcp dport { 22, 8000 } accept

        # WAN: nothing inbound, ever. (Established replies already accepted above.)
        iifname $WAN drop

        log prefix "ben-fw drop in: " limit rate 5/minute
    }

    chain forward {
        type filter hook forward priority 0; policy drop;   # gateway never routes between zones
    }

    chain output {
        type filter hook output priority 0; policy drop;
        oif lo accept
        ct state established,related accept
        # Gateway -> controls equipment: Modbus TCP (502), SNMP (161), SNMP traps back are inbound-established
        oifname $CTRL ip daddr @ctrl_nodes tcp dport 502 accept
        oifname $CTRL ip daddr @ctrl_nodes udp dport 161 accept
        oifname $CTRL ip daddr @ctrl_nodes tcp dport 1883 accept      # loopback-equivalent for local tools
        oifname $CTRL udp dport { 67, 68 } accept
        oifname $CTRL icmp type echo-request accept
        oifname $MGMT accept
        # Outbound-only VPN handshake (UDP 51820) and traffic inside the tunnel
        oifname $WAN udp dport 51820 accept
        oifname $WAN udp dport 123 accept                              # chrony upstream NTP, if WAN enabled
        oifname $WAN tcp dport { 80, 443 } ct mark 0x5a accept         # apt/OTA fetch only when install.sh set mark (ENABLE_WAN=1)
        oifname $VPN accept
        log prefix "ben-fw drop out: " limit rate 5/minute
    }
}
