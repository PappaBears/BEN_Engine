# BEN Engine gateway — Mosquitto broker configuration (Schreiber AI)
# Installed to /etc/mosquitto/conf.d/ben.conf by install.sh
# Status: implemented, unverified on hardware.

per_listener_settings true
persistence true
persistence_location /var/lib/mosquitto/
log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true
max_inflight_messages 40
max_queued_messages 10000     # ~3 nodes x 1 h at 1 Hz if the API service is restarting
message_size_limit 4096       # node messages are < 1 kB; anything bigger is a fault

# ---- Listener 1: controls VLAN, plain MQTT for ESP32 nodes (no TLS; the VLAN is the trust boundary
#      per CONTROLS_SPEC.md zone model; every node has its own username/password and ACL).
listener 1883 10.20.0.1
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/ben_passwd
acl_file /etc/mosquitto/ben_acl

# ---- Listener 2: TLS for the API service / dashboard / engineering laptop on the management VLAN.
#      Certificates are generated by install.sh (local CA). Ready; enabled once certs exist.
listener 8883 10.30.0.1
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/ben_passwd
acl_file /etc/mosquitto/ben_acl
cafile   /etc/mosquitto/certs/ben-ca.crt
certfile /etc/mosquitto/certs/gateway.crt
keyfile  /etc/mosquitto/certs/gateway.key
tls_version tlsv1.2
require_certificate false

# ---- Listener 3: WebSockets for the local dashboard (TLS, management VLAN only)
listener 9001 10.30.0.1
protocol websockets
allow_anonymous false
password_file /etc/mosquitto/ben_passwd
acl_file /etc/mosquitto/ben_acl
cafile   /etc/mosquitto/certs/ben-ca.crt
certfile /etc/mosquitto/certs/gateway.crt
keyfile  /etc/mosquitto/certs/gateway.key
