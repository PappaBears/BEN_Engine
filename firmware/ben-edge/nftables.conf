#!/usr/sbin/nft -f
# BEN Engine edge computer firewall — Schreiber AI. Installed to /etc/ben/nftables.conf
# Zones (CONTROLS_SPEC.md): CTRL = controls VLAN 20 (PLC, Pod E, meters, cooling, UPS, PDUs),
# wpan0 = Thread mesh (BEN Pods, own zone, DTLS/mTLS), MGMT = management (dashboard, laptop),
# customer IT: no interface. wan0 = optional WAN uplink (OFF by default), wg0 = outbound-only support VPN.
# Default: DROP everything. The only forwarding is Thread <-> this host's own addresses (none to CTRL).
flush ruleset

define CTRL   = "enp1s0"      # 10.20.0.0/24 — PLC 10.20.0.10, Pod E, meters, PDUs, cooling, UPS
define MGMT   = "enp2s0"      # 10.30.0.0/24 — dashboard, engineering laptop
define WPAN   = "wpan0"       # fd00:ben::/64 — Thread mesh via OTBR (RCP on USB)
define WAN    = "wan0"        # disabled unless ENABLE_WAN=1 at install
define VPN    = "wg0"

table inet ben {
    set ctrl_hosts { type ipv4_addr; flags interval; elements = { 10.20.0.0/24 } }
    set mgmt_hosts { type ipv4_addr; flags interval; elements = { 10.30.0.0/24 } }
    set plc        { type ipv4_addr; elements = { 10.20.0.10 } }

    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, mld2-listener-report, packet-too-big, time-exceeded, destination-unreachable } accept

        # Thread mesh: Pods -> broker mTLS 8883, SNTP 123, CoAP 5683 (OTA/attestation), MeshCoP/TREL to OTBR (UDP 49191 border agent)
        iifname $WPAN ip6 saddr fd00:ben::/64 tcp dport 8883 accept
        iifname $WPAN ip6 saddr fd00:ben::/64 udp dport { 123, 5683 } accept
        iifname $WPAN udp dport 49191 accept

        # Controls VLAN: Pod E -> broker mTLS (8883) and SNTP (123); DHCP for Pod E / meters; nothing else inbound
        iifname $CTRL ip saddr @ctrl_hosts tcp dport 8883 accept
        iifname $CTRL ip saddr @ctrl_hosts udp dport { 123, 67 } accept
        iifname $CTRL ip saddr @plc tcp dport 8883 accept             # PLCnext MQTT client option (not default)

        # Management: dashboard/API (8000), MQTT TLS (8884), MQTT-WS (9001), SSH (22), SNTP
        iifname $MGMT ip saddr @mgmt_hosts tcp dport { 22, 8000, 8884, 9001 } accept
        iifname $MGMT ip saddr @mgmt_hosts udp dport 123 accept

        # Remote support over VPN only (SSH + API), never over raw WAN
        iifname $VPN tcp dport { 22, 8000 } accept

        iifname $WAN drop
        log prefix "ben-fw drop in: " limit rate 5/minute
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        # The host never routes between CTRL, MGMT, WAN. Thread is a stub: OTBR delivers to this host's
        # broker only; mesh-to-mesh traffic stays inside the RCP. No forward rule is needed for that.
    }

    chain output {
        type filter hook output priority 0; policy drop;
        oif lo accept
        ct state established,related accept
        # edge -> PLC: Modbus TCP 502 and OPC UA 4840 (ben-plc-bridge); edge -> equipment: Modbus TCP 502, SNMP 161
        oifname $CTRL ip daddr @plc tcp dport { 502, 4840 } accept
        oifname $CTRL ip daddr @ctrl_hosts tcp dport 502 accept
        oifname $CTRL ip daddr @ctrl_hosts udp dport 161 accept
        oifname $CTRL ip daddr @ctrl_hosts tcp dport 8883 accept       # local tools to our own broker address
        oifname $CTRL udp dport { 67, 68 } accept
        oifname $CTRL icmp type echo-request accept
        # edge -> Pods: cmd/attest go through the broker (loopback); CoAP OTA server replies are established; SNTP replies established
        oifname $WPAN ip6 daddr fd00:ben::/64 udp dport 5683 accept
        oifname $WPAN icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, echo-request } accept
        oifname $MGMT accept
        oifname $WAN udp dport 51820 accept
        oifname $WAN udp dport 123 accept                              # chrony upstream NTP, if WAN enabled
        oifname $WAN tcp dport { 80, 443 } ct mark 0x5a accept         # apt/OTA fetch only when install.sh set mark (ENABLE_WAN=1)
        oifname $VPN accept
        log prefix "ben-fw drop out: " limit rate 5/minute
    }
}
