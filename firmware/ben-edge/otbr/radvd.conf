# BEN Engine — advertise the Thread OMR prefix route and the broker address on the controls VLAN so Pod E
# (Ethernet) reaches fd00:ben::1 directly. Installed to /etc/radvd.conf. No default route is advertised.
interface enp1s0 {
    AdvSendAdvert on;
    AdvDefaultLifetime 0;              # we are NOT a default router
    MinRtrAdvInterval 30;
    MaxRtrAdvInterval 90;
    prefix fd00:ben:1::/64 {           # Pod E / controls VLAN IPv6 prefix (SLAAC)
        AdvOnLink on;
        AdvAutonomous on;
    };
    route fd00:ben::/64 {              # Thread mesh prefix via this host
        AdvRouteLifetime 1800;
    };
    RDNSS fd00:ben:1::1 { };
};
