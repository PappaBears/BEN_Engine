# BEN Engine edge computer — log rotation. Installed to /etc/logrotate.d/ben
/var/log/ben/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0640 ben ben
}
/var/log/mosquitto/mosquitto.log {
    weekly
    rotate 8
    compress
    missingok
    notifempty
    postrotate
        /usr/bin/systemctl kill -s HUP mosquitto.service >/dev/null 2>&1 || true
    endscript
}
