# BEN Engine edge computer — chrony (time source for the controls VLAN and the Thread mesh)
# Installed to /etc/chrony/chrony.conf. Status: implemented, unverified on hardware.
# The edge computer is the unit's single time reference: Pods SNTP to fd00:ben::1 over Thread, Pod E
# and the PLC to 10.20.0.1, so even with no WAN every record in the unit shares one clock. If WAN/VPN
# exists chrony follows NTP pools; the Karbon 400 has an RTC with supercap, so time survives a reboot.
pool 2.debian.pool.ntp.org iburst maxsources 4
# refclock SHM 0 refid GPS precision 1e-1 offset 0.0 delay 0.2      # optional GNSS receiver on COM1
# refclock PPS /dev/pps0 lock GPS refid PPS

driftfile /var/lib/chrony/chrony.drift
makestep 1.0 3
rtcsync
logdir /var/log/chrony
log tracking measurements statistics

# Serve time to the controls VLAN, the Thread mesh and the management VLAN even when unsynchronised:
# an agreed wrong clock is better than 50 disagreeing ones; the API stamps "clock_unsynced".
allow 10.20.0.0/24
allow 10.30.0.0/24
allow fd00:ben::/64
bindaddress 10.20.0.1
bindaddress 10.30.0.1
bindaddress fd00:ben::1
local stratum 10 orphan
