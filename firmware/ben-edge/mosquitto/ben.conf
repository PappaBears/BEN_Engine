# BEN Engine edge computer — Mosquitto broker configuration (Schreiber AI)
# Installed to /etc/mosquitto/conf.d/ben.conf by install.sh (Pro) or lite/install.sh (Lite).
# Status: implemented, unverified on hardware.

per_listener_settings true
persistence true
persistence_location /var/lib/mosquitto/
log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true
max_inflight_messages 40
max_queued_messages 20000     # ~5 Pods x 1 h at 1 Hz if the API service is restarting
message_size_limit 4096       # Pod messages are < 1 kB; anything bigger is a fault

# ---- Listener 1: BEN Pods over Thread (IPv6, border router on this host). MUTUAL TLS: the Pod presents
#      its device certificate (Schreiber AI Device CA chain); the certificate CN (pod-<unit>-<nodeN>) is
#      the MQTT username the ACL is keyed on. No passwords travel on the mesh.
listener 8883 fd00:ben::1
protocol mqtt
allow_anonymous false
cafile   /etc/ben/pki/trusted-clients.crt
certfile /etc/ben/pki/broker.crt
keyfile  /etc/ben/pki/broker.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384
acl_file /etc/mosquitto/ben_acl

# ---- Listener 2: controls VLAN IPv4 — Pod E on Ethernet (mTLS as above) and the plc bridge / pollers on
#      this host (client cert benapi). Plain 1883 no longer exists: everything is mTLS.
listener 8883 10.20.0.1
protocol mqtt
allow_anonymous false
cafile   /etc/ben/pki/trusted-clients.crt
certfile /etc/ben/pki/broker.crt
keyfile  /etc/ben/pki/broker.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
acl_file /etc/mosquitto/ben_acl

# ---- Listener 3: management VLAN — API service, dashboard, engineering laptop. Server TLS + password
#      (benapi / dashboard users) so a laptop needs no client certificate.
listener 8884 10.30.0.1
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/ben_passwd
acl_file /etc/mosquitto/ben_acl
cafile   /etc/ben/pki/unit-ca.crt
certfile /etc/ben/pki/broker.crt
keyfile  /etc/ben/pki/broker.key
tls_version tlsv1.2
require_certificate false

# ---- Listener 4: WebSockets for the local dashboard (TLS, management VLAN only)
listener 9001 10.30.0.1
protocol websockets
allow_anonymous false
password_file /etc/mosquitto/ben_passwd
acl_file /etc/mosquitto/ben_acl
cafile   /etc/ben/pki/unit-ca.crt
certfile /etc/ben/pki/broker.crt
keyfile  /etc/ben/pki/broker.key
